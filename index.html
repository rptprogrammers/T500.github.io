<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>נמר אחזקה</title>
  <link rel="stylesheet" href="title.css">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <audio id="modelSound" src="sound.mp3" preload="auto"></audio>

  <style>

    .model-container {
      max-width: 90vw;
      margin: 0 auto 4rem;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
    }
  </style>
</head>
<body>
  <header class="elegant-header">
    <div class="logo-wrapper right large-logo">
  <img src="image/logo1.png" alt="לוגו ימני" />
</div>
    <div class="center-box">
      <p class="top-text"> </p>
      <h1 class="main-title">בהוקרה ממנת"ק</h1>
      <p class="bottom-text"> </p>
    </div>
    <div class="logo-wrapper left left large-logo-1 ">
      <img src="image/logo2.png" alt="לוגו שמאלי" />
    </div>
  </header>

  <!-- תוכן בהמשך הדף -->
  <main>
    <section style="padding: 60px 35px ; font-size: 1.5rem;">
     <div class="model-container">
		<model-viewer id="viewer"
		  skybox-image="spruit_sunrise_1k_HDR.jpg" skybox-height="4m"
		  max-camera-orbit="auto 100deg auto"
		  src="25-100M.glb" 
		  ios-src="25-100M.usdz"
		  alt="Model 1" 
		  auto-rotate 
		  camera-controls 
		  ar 
		  ar-modes="scene-viewer quick-look webxr"
		  shadow-intensity="2"
		  autoplay>
		</model-viewer>
	</div>
    </section>
  </main>
</body>
<script>
  const viewer = document.getElementById("viewer");
  const sound  = document.getElementById("modelSound");

	viewer.addEventListener("model-visibility", () => {
	  sound.volume = 0;
	  sound.play();
	  let fade = setInterval(() => {
		if (sound.volume < 1) sound.volume += 0.05;
		else clearInterval(fade);
	  }, 200);
	});
</script>
</html>
